<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>♡ Anaisha</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >
</head>

<body>

    <!-- Background -->
    <div class="background"></div>
    <div class="background-blur"></div>
    <div class="noise"></div>

    <!-- Particles -->
    <div id="particles"></div>

    <!-- Enter screen -->
    <div id="enter-screen">
        <div class="enter-box">

            <div class="enter-symbol">♡</div>

            <h1>click to enter</h1>

            <p>୨ৎ welcome to my little world</p>

            <div class="enter-line"></div>

            <span>enter</span>

        </div>
    </div>

    <!-- Main -->
    <main class="page">

        <section class="profile-card">

            <!-- Top glow -->
            <div class="card-glow"></div>

            <!-- Avatar -->
            <div class="avatar-area">

                <div class="avatar-ring">
                    <img
                        src="avatar.gif"
                        alt="Anaisha"
                        class="avatar"
                    >
                </div>

                <div class="online-dot"></div>

            </div>

            <!-- Name -->
            <h1 class="username">
                ~ ♡ Anaisha ﹒‹𝟹
            </h1>

            <div class="handle">
                @its.anaisha
            </div>

            <!-- Bio -->
            <div class="bio">

                <p>୨ৎ not everyone's cup of tea</p>
                <p>♡ creating my own little world</p>

            </div>

            <!-- Location -->
            <div class="location">
                <i class="fa-solid fa-location-dot"></i>
                <span>India</span>
            </div>

            <!-- Socials -->
            <div class="socials">

                <a
                    href="https://anaisha-discord-auth.onrender.com/login"
                    class="social discord"
                    id="discord-button"
                >
                    <i class="fa-brands fa-discord"></i>
                    <span id="discord-text">Connect Discord</span>
                </a>

                <a
                    href="https://www.roblox.com/"
                    target="_blank"
                    rel="noopener noreferrer"
                    class="social roblox"
                >
                    <i class="fa-solid fa-gamepad"></i>
                    <span>Roblox</span>
                </a>

                <a
                    href="https://github.com/VoidKii"
                    target="_blank"
                    rel="noopener noreferrer"
                    class="social github"
                >
                    <i class="fa-brands fa-github"></i>
                    <span>GitHub</span>
                </a>

            </div>

            <!-- Discord connected -->
            <div id="discord-status">
                ♡ Discord connected
            </div>

            <!-- Website -->
            <a
                href="https://anaisha.pages.dev/"
                class="website-link"
                target="_blank"
                rel="noopener noreferrer"
            >
                <i class="fa-solid fa-link"></i>
                anaisha.pages.dev
            </a>

            <!-- Stats -->
            <div class="stats">

                <div class="stat">
                    <strong id="views">0</strong>
                    <span>Views</span>
                </div>

                <div class="stat">
                    <strong>♡</strong>
                    <span>Status</span>
                </div>

                <div class="stat">
                    <strong>14</strong>
                    <span>UID</span>
                </div>

            </div>

            <div class="divider"></div>

            <!-- Footer -->
            <div class="footer">

                <span>
                    made with <span class="heart">♡</span>
                </span>

                <span>
                    © <span id="year"></span> Anaisha
                </span>

            </div>

        </section>

    </main>

    <!-- Music -->
    <audio id="music" loop>
        <source src="music.mp3" type="audio/mpeg">
    </audio>

    <button
        id="music-button"
        class="music-button"
        aria-label="Toggle music"
    >
        <i class="fa-solid fa-volume-xmark"></i>
    </button>

    <script src="script.js"></script>

</body>
</html>
