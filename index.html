<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>♡ Anaisha</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

    <!-- Background -->
    <div class="background"></div>
    <div class="overlay"></div>

    <!-- Click to enter -->
    <div id="enter-screen">
        <div class="enter-content">
            <div class="enter-icon">♡</div>
            <h1>click to enter</h1>
            <p>♡ welcome to my profile</p>
        </div>
    </div>

    <!-- Main -->
    <main class="page">

        <section class="profile-card">

            <!-- Avatar -->
            <div class="avatar-wrapper">
                <img src="avatar.gif" alt="Anaisha" class="avatar">
                <div class="online-dot"></div>
            </div>

            <!-- Name -->
            <h1 class="username">
                ~ ♡ Anaisha ﹒‹𝟹
            </h1>

            <p class="handle">
                @its.anaisha
            </p>

            <!-- Bio -->
            <div class="bio">
                <p>୨ৎ not everyone's cup of tea</p>
                <p>♡ creating my own little world</p>
            </div>

            <!-- Location -->
            <div class="location">
                <i class="fa-solid fa-location-dot"></i>
                India
            </div>

            <!-- Social buttons -->
            <div class="socials">

                <!-- Discord OAuth -->
                <a href="https://anaisha-discord-auth.onrender.com/login"
                   class="social discord">
                    <i class="fa-brands fa-discord"></i>
                    <span>Connect Discord</span>
                </a>

                <a href="https://www.roblox.com/"
                   target="_blank"
                   class="social roblox">
                    <i class="fa-solid fa-gamepad"></i>
                    <span>Roblox</span>
                </a>

                <a href="#" class="social">
                    <i class="fa-brands fa-github"></i>
                    <span>GitHub</span>
                </a>

            </div>

            <!-- Stats -->
            <div class="stats">

                <div class="stat">
                    <span class="stat-number" id="views">0</span>
                    <span class="stat-label">Views</span>
                </div>

                <div class="stat">
                    <span class="stat-number">♡</span>
                    <span class="stat-label">Status</span>
                </div>

                <div class="stat">
                    <span class="stat-number">14</span>
                    <span class="stat-label">UID</span>
                </div>

            </div>

            <!-- Divider -->
            <div class="divider"></div>

            <!-- Bottom -->
            <div class="footer">

                <span>
                    made with <span class="heart">♡</span>
                </span>

                <span>
                    © <span id="year"></span> Anaisha
                </span>

            </div>

        </section>

    </main>

    <!-- Music -->
    <audio id="music" loop>
        <source src="music.mp3" type="audio/mpeg">
    </audio>

    <button id="music-button" class="music-button">
        <i class="fa-solid fa-volume-xmark"></i>
    </button>

    <!-- Particles -->
    <div id="particles"></div>

    <script src="script.js"></script>

</body>
</html>
